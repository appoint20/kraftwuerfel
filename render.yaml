# Render Blueprint — https://render.com/docs/blueprint-spec
#
# In Render: New -> Blueprint -> dieses Repo wählen. Danach die beiden
# Supabase-Werte im Dashboard eintragen (sync: false heißt: Render fragt
# beim Anlegen danach und speichert sie nicht im Repo).
#
# PORT setzt Render selbst; der Container liest ihn aus der Umgebung.
services:
  - type: web
    name: kraftwuerfel
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
