# __PORT__ wird beim Containerstart ersetzt (docker/40-kraftwuerfel-env.sh).
server {
    listen __PORT__;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Render terminiert TLS davor; das echte Client-Protokoll steht im Header.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite hängt einen Hash an jeden Assetnamen — die dürfen ewig im Cache bleiben.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Diese beiden entscheiden, welche Version und welche Konfiguration gilt.
    # Würden sie gecacht, liefe der Browser nach einem Deploy auf alte Werte.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Single-Page-App: alles Unbekannte bekommt die index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
